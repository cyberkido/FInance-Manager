<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Finance Manager</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#141a2e;--mu:#6b7490;--bd:#e3e7f1;--ac:#6c5ce7;--ac2:#00b8a0;--rd:#ef476f;--am:#f2a31b;--sh:0 6px 24px rgba(40,50,110,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0f1d;--card:#171b2f;--tx:#eef0fa;--mu:#9099b8;--bd:#272c47;--sh:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0c0f1d;--card:#171b2f;--tx:#eef0fa;--mu:#9099b8;--bd:#272c47;--sh:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
#app{max-width:720px;margin:0 auto;padding:14px 14px 110px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px}small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,#6c5ce7,#00b8a0);color:#fff;border:0}
.hero small{color:rgba(255,255,255,.8)}.big{font-size:32px;font-weight:700;letter-spacing:-.5px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px}.stat b{display:block;font-size:15px}
.bar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;transition:width .8s}
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);gap:8px}.item:last-child{border:0}
.pos{color:var(--ac2)}.neg{color:var(--rd)}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac);font-weight:600}
.chip.g{background:color-mix(in srgb,var(--ac2) 18%,transparent);color:var(--ac2)}.chip.w{background:color-mix(in srgb,var(--am) 20%,transparent);color:var(--am)}
button,select,input{font:inherit;color:var(--tx)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer}.btn.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}.btn.sm{padding:6px 10px;font-size:13px}
.ic{background:none;border:0;cursor:pointer;color:var(--mu);font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:2px 8px;border-radius:10px}nav button span{font-size:20px}nav button.on{color:var(--ac);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;border:0;background:var(--ac);color:#fff;box-shadow:0 8px 20px rgba(108,92,231,.5);cursor:pointer;z-index:6}
.sheet{position:fixed;inset:0;background:rgba(5,8,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--card);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .25s}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.ai{white-space:normal;line-height:1.55}.msg{padding:10px 12px;border-radius:14px;margin:8px 0;max-width:92%}.msg.u{background:var(--ac);color:#fff;margin-left:auto}.msg.a{background:var(--bg);border:1px solid var(--bd)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer}
.scroll{overflow-x:auto}.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer}.seg .on{background:var(--ac);color:#fff}
.note{font-size:12px;color:var(--mu);margin-top:8px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),K='fm_v1',ld=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmt=n=>(n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.toISOString().slice(0,10),mk=d=>d.slice(0,7);
const CATS={Food:'#ff7675',Transport:'#74b9ff',Rent:'#a29bfe',Shopping:'#fd79a8',Bills:'#fdcb6e',Health:'#55efc4',Fun:'#e17055',EMI:'#e84393',Other:'#b2bec3'};
const ROLES=['Expense','Savings','Investment','Auto-debit','Backup'];
const RISK={conservative:[['Liquid fund / FD',45],['Debt / PPF',30],['Gold',15],['Index fund SIP',10]],balanced:[['Liquid fund / FD',20],['Debt / PPF',20],['Gold',15],['Index fund SIP',45]],aggressive:[['Liquid fund / FD',10],['Gold',10],['Index fund SIP',55],['Flexi/Mid-cap fund',25]]};
const AC=['#6c5ce7','#00b8a0','#f2a31b','#ef476f','#4aa8ff'];
let S,view='home',chat=[],busy=false;
function seed(){let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280,tx=[],now=new Date();
 for(let m=5;m>=0;m--){const d=new Date(now.getFullYear(),now.getMonth()-m,1),y=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0');
  tx.push({id:'i'+m,t:'income',a:65000,c:'Salary',b:0,d:`${y}-${mo}-01`,n:'Salary'});
  tx.push({id:'r'+m,t:'expense',a:15000,c:'Rent',b:0,d:`${y}-${mo}-02`,n:'Rent'});
  [['Food',9000],['Transport',4000],['Shopping',6000],['Bills',3500],['Health',1500],['Fun',3000]].forEach(([c,v],i)=>{const day=Math.min(27,3+i*4);if(m===0&&day>now.getDate())return;tx.push({id:c+m,t:'expense',a:Math.round(v*(.8+rnd()*.5)),c,b:i%2?1:0,d:`${y}-${mo}-${String(day).padStart(2,'0')}`,n:c})});
  if(m>0)tx.push({id:'v'+m,t:'invest',a:5000,c:'Index fund SIP',b:2,d:`${y}-${mo}-05`,n:'SIP'})}
 return{tx,risk:'balanced',sample:true,banks:[{n:'Bank A – Salary',open:60000,rate:3,cash:0,min:10000,role:'Auto-debit'},{n:'Bank B – Cashback Card',open:20000,rate:2.7,cash:5,min:0,role:'Expense'},{n:'Bank C – High Interest',open:80000,rate:7,cash:0,min:0,role:'Savings'}],
 bills:[{n:'Rent',a:15000,day:2,b:0},{n:'Phone & Internet',a:999,day:12,b:0},{n:'Insurance premium',a:2100,day:18,b:0},{n:'Index fund SIP',a:5000,day:5,b:2}],
 goals:[{n:'Emergency fund',t:150000,s:60000},{n:'Travel',t:80000,s:22000}],loans:[{n:'Car loan',orig:600000,out:380000,rate:9.2,emi:14500,day:7,b:0},{n:'Personal loan',orig:200000,out:90000,rate:13,emi:7200,day:15,b:0}],dl:1200}}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||seed();S.loans=S.loans||[];S.dl=S.dl||1200;if(S.sample&&!S.lseed&&!S.loans.length){S.loans=seed().loans;S.lseed=1}const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const bal=i=>S.banks[i].open+S.tx.filter(x=>x.b==i).reduce((s,x)=>s+(x.t=='income'?x.a:-x.a),0);
const sum=a=>a.reduce((s,x)=>s+x.a,0),cm=mk(ld());
function months(n){const o=[],now=new Date();for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);o.push({k:mk(iso(new Date(d.getTime()-d.getTimezoneOffset()*6e4))),l:d.toLocaleString('en',{month:'short'})})}return o}
function M(k){const t=S.tx.filter(x=>mk(x.d)==k);return{inc:sum(t.filter(x=>x.t=='income')),exp:sum(t.filter(x=>x.t=='expense')),inv:sum(t.filter(x=>x.t=='invest')),t}}
function nextDue(b){const n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),b.day);if(d<new Date(n.getFullYear(),n.getMonth(),n.getDate()))d.setMonth(d.getMonth()+1);return d}
const days=d=>Math.round((d-new Date(new Date().setHours(0,0,0,0)))/864e5);
const allBills=()=>S.bills.concat(S.loans.map(l=>({n:l.n+' EMI',a:l.emi,day:l.day,b:l.b,loan:1})));
function calc(){const cur=M(cm),ms=months(4).slice(0,3).map(m=>M(m.k).exp).filter(x=>x>0),avg=ms.length?ms.reduce((a,b)=>a+b)/ms.length:cur.exp,
 liquid=S.banks.reduce((s,_,i)=>s+bal(i),0),invested=sum(S.tx.filter(x=>x.t=='invest')),bills=allBills().filter(b=>days(nextDue(b))<=30).reduce((s,b)=>s+b.a,0),buffer=avg*3;
 return{cur,avg,liquid,invested,bills,buffer,deploy:liquid-buffer-bills,debt:S.loans.reduce((s,l)=>s+l.out,0),emi:S.loans.reduce((s,l)=>s+l.emi,0),nw:liquid+invested-S.loans.reduce((s,l)=>s+l.out,0),rate:cur.inc?Math.max(0,(cur.inc-cur.exp)/cur.inc*100):0}}
function insights(){const c=calc(),o=[],cats={};c.cur.t.filter(x=>x.t=='expense').forEach(x=>cats[x.c]=(cats[x.c]||0)+x.a);
 const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).filter(x=>x[0]!='Rent')[0],ps=months(2),prev=M(ps[0].k).exp;
 if(c.cur.inc)o.push(c.rate>=30?['g',`Great savings rate: ${c.rate.toFixed(0)}% of income this month.`]:c.rate>=15?['w',`Savings rate is ${c.rate.toFixed(0)}% – aim for 30% by trimming ${top?top[0]:'discretionary'} spend.`]:['r',`Savings rate only ${c.rate.toFixed(0)}% – review spending now.`]);
 if(top)o.push(['w',`Biggest flexible category: ${top[0]} (${fmt(top[1])}).`]);
 if(prev&&c.cur.exp>prev*1.1)o.push(['r',`Spending is up ${((c.cur.exp/prev-1)*100).toFixed(0)}% vs last month.`]);
 allBills().forEach(b=>{const d=days(nextDue(b));if(d<=7&&bal(b.b)<b.a*1.2)o.push(['r',`${b.n} (${fmt(b.a)}) due in ${d}d – ${S.banks[b.b].n} balance is tight.`])});
 if(c.deploy>5000)o.push(['g',`You can deploy about ${fmt(c.deploy)} after buffer and bills. See Invest.`]);
 else if(c.deploy<0)o.push(['w','Cash is below your 3-month emergency buffer – build that before investing.']);if(c.emi&&c.cur.inc&&c.emi/c.cur.inc>.4)o.push(['r',`EMIs take ${(c.emi/c.cur.inc*100).toFixed(0)}% of income – above the 40% comfort limit.`]);if(dayTotal(ld())>S.dl)o.push(['w',`Today's spend ${fmt(dayTotal(ld()))} is over your ${fmt(S.dl)} daily budget.`]);
 return o}
const snap=()=>{const c=calc(),cats={};c.cur.t.filter(x=>x.t=='expense').forEach(x=>cats[x.c]=(cats[x.c]||0)+x.a);
 return JSON.stringify({currency:'INR',month:{income:c.cur.inc,expenses:c.cur.exp,invested:c.cur.inv,byCategory:cats},avgMonthlyExpense3m:Math.round(c.avg),netWorth:Math.round(c.nw),totalCash:Math.round(c.liquid),invested:c.invested,emergencyBuffer3m:Math.round(c.buffer),billsNext30d:c.bills,deployable:Math.round(c.deploy),risk:S.risk,banks:S.banks.map((b,i)=>({name:b.n,balance:bal(i),interestPct:b.rate,cardCashbackPct:b.cash,minBalance:b.min,role:b.role})),bills:S.bills.map(b=>({...b,bank:S.banks[b.b]?.n})),goals:S.goals,loans:S.loans.map(l=>({...l,bank:S.banks[l.b]?.n})),monthlyEMI:c.emi,totalLoanOutstanding:c.debt,dailyBudget:S.dl,todaySpend:dayTotal(ld())})};
function md(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#+\s*(.+)$/gm,'<b>$1</b>').replace(/^[-*]\s+/gm,'• ').replace(/\n/g,'<br>')}
async function ask(q, out) {
  out.textContent = 'Thinking…';
  
  const prompt = `You are a concise, practical personal-finance advisor for an Indian user (amounts in INR). Use ONLY the data given; be specific with numbers; use short bullets and bold key actions; end with one-line caution that this is educational, not licensed advice. Keep under 220 words.\n\nDATA: ${snap()}\n\nQUESTION: ${q}`;

  try {
    const res = await fetch('/api/openai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });

    const data = await res.json();
    
    if (res.ok && data.response) {
      out.innerHTML = md(data.response);
    } else {
      out.textContent = data.error || 'Failed to generate response.';
    }
  } catch (e) {
    out.textContent = 'Error connecting to server.';
  }
}
 function autoAssign(){const b=S.banks;if(!b.length)return;b.forEach(x=>x.role='Backup');
 const ex=b.reduce((m,x)=>x.cash>m.cash?x:m,b[0]);ex.role='Expense';let r=b.filter(x=>x.role=='Backup');
 if(r.length){const s=r.reduce((m,x)=>x.rate>m.rate?x:m,r[0]);s.role=r.length>2?'Savings':'Investment';r=r.filter(x=>x!==s);
  if(r.length){const a=r.reduce((m,x,)=>bal(S.banks.indexOf(x))>bal(S.banks.indexOf(m))?x:m,r[0]);a.role='Auto-debit';r=r.filter(x=>x!==a);if(r.length)r[0].role='Savings'}}
 save();render()}
const why={Expense:'Best card cashback – use for daily spends.',Savings:'Highest interest – park idle money here.',Investment:'Keep for SIPs, FD & fund purchases.','Auto-debit':'Largest steady balance – avoids bounced EMIs/bills.',Backup:'Spare account.'};
function form(title,fields,fn){const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div><h2>${title}</h2>${fields.map(f=>`<label>${f.l}</label>${f.o?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${o[0]??o}">${o[1]??o}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${f.v??''}" ${f.t=='number'?'inputmode="decimal"':''}>`}`).join('')}<div class="row" style="margin-top:16px"><button class="btn s" id="x">Cancel</button><button class="btn" id="ok">Save</button></div></div>`;
 document.body.appendChild(d);d.onclick=e=>{if(e.target==d)d.remove()};d.querySelector('#x').onclick=()=>d.remove();
 d.querySelector('#ok').onclick=()=>{const v={};fields.forEach(f=>{const e=d.querySelector('#f_'+f.k);v[f.k]=f.t=='number'?parseFloat(e.value)||0:e.value});fn(v);S.sample=S.sample;save();d.remove();render()}}
const bankOpts=()=>S.banks.map((b,i)=>[i,b.n]);
const A={
 addTx(){if(!S.banks.length)return A.addBank();form('Add transaction',[{k:'t',l:'Type',o:[['expense','Expense'],['income','Income'],['invest','Investment']]},{k:'a',l:'Amount (₹)',t:'number'},{k:'c',l:'Category',o:Object.keys(CATS).concat(['Salary','Index fund SIP','Gold','FD / Debt','Other income'])},{k:'b',l:'Bank',o:bankOpts()},{k:'d',l:'Date',t:'date',v:ld()},{k:'n',l:'Note'}],v=>{if(v.a>0)S.tx.push({...v,b:+v.b,id:'t'+Date.now()})})},
 addBank(){form('Add bank account',[{k:'n',l:'Bank name'},{k:'open',l:'Current balance (₹)',t:'number'},{k:'rate',l:'Savings interest % p.a.',t:'number'},{k:'cash',l:'Card cashback / rewards %',t:'number'},{k:'min',l:'Minimum balance (₹)',t:'number'}],v=>{if(v.n)S.banks.push({...v,role:'Backup'})})},
 addBill(){form('Add auto-debit / bill',[{k:'n',l:'Name (EMI, SIP, rent…)'},{k:'a',l:'Amount (₹)',t:'number'},{k:'day',l:'Day of month',t:'number',v:5},{k:'b',l:'Debited from',o:bankOpts()}],v=>{if(v.n&&v.a>0)S.bills.push({...v,b:+v.b,day:Math.min(28,Math.max(1,v.day||1))})})},
 addGoal(){form('Add goal',[{k:'n',l:'Goal'},{k:'t',l:'Target (₹)',t:'number'},{k:'s',l:'Saved so far (₹)',t:'number'}],v=>{if(v.n&&v.t>0)S.goals.push(v)})},
 fund(i){form('Add to '+esc(S.goals[i].n),[{k:'a',l:'Amount (₹)',t:'number'}],v=>{S.goals[i].s+=v.a})},
 del(k,i){S[k].splice(i,1);if(k=='banks'){S.tx=S.tx.filter(x=>x.b!=i).map(x=>({...x,b:x.b>i?x.b-1:x.b}));S.bills=S.bills.filter(x=>x.b!=i).map(x=>({...x,b:x.b>i?x.b-1:x.b}));S.loans=S.loans.filter(x=>x.b!=i).map(x=>({...x,b:x.b>i?x.b-1:x.b}))}save();render()},
 role(i,v){S.banks[i].role=v;save()},risk(r){S.risk=r;save();render()},go(v){view=v;render();scrollTo(0,0)},
 clear(){S={tx:[],risk:'balanced',banks:[],bills:[],goals:[],loans:[],dl:1200};save();render()},
 theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'},
 async q(t,el){const out=el||document.getElementById('aiout');if(!el&&view=='ai'){const q=t||$('#q').value.trim();if(!q||busy)return;busy=true;chat.push({r:'u',t:q});chat.push({r:'a',t:''});render();const o=document.querySelectorAll('.msg.a');await ask(q,o[o.length-1]);chat[chat.length-1].t=o[o.length-1].innerText;busy=false;return}
  if(out)await ask(t,out)}
};
const catBars=()=>{const c=calc().cur,cats={};c.t.filter(x=>x.t=='expense').forEach(x=>cats[x.c]=(cats[x.c]||0)+x.a);const e=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
 return e.length?e.map(([k,v])=>`<div style="margin:9px 0"><div class="row"><span>${esc(k)}</span><b>${fmt(v)}</b></div><div class="bar"><i style="width:${v/e[0][1]*100}%;background:${CATS[k]||'#999'}"></i></div></div>`).join(''):'<p class="mu">No expenses this month yet.</p>'};
function trend(){const ms=months(6),d=ms.map(m=>M(m.k)),mx=Math.max(1,...d.flatMap(x=>[x.inc,x.exp])),w=300/6;
 return`<svg viewBox="0 0 300 130" style="width:100%">${d.map((x,i)=>`<rect x="${i*w+8}" y="${100-x.inc/mx*90}" width="16" height="${x.inc/mx*90}" rx="4" fill="var(--ac2)"/><rect x="${i*w+27}" y="${100-x.exp/mx*90}" width="16" height="${x.exp/mx*90}" rx="4" fill="var(--ac)"/><text x="${i*w+27}" y="118" font-size="10" text-anchor="middle" fill="var(--mu)">${ms[i].l}</text>`).join('')}</svg><div class="note"><span class="pos">■</span> Income &nbsp;<span style="color:var(--ac)">■</span> Expenses</div>`}
function home(){const c=calc(),ins=insights(),up=allBills().map(b=>({...b,d:days(nextDue(b))})).sort((a,b)=>a.d-b.d).slice(0,4);
 return`<div class="card hero"><small>Net worth</small><div class="big">${fmt(c.nw)}</div><small>Cash ${fmt(c.liquid)} · Invested ${fmt(c.invested)} · Loans −${fmt(c.debt)}</small>
 <div class="grid3"><div class="stat"><small>Income</small><b>${fmt(c.cur.inc)}</b></div><div class="stat"><small>Spent</small><b>${fmt(c.cur.exp)}</b></div><div class="stat"><small>Saved</small><b>${c.rate.toFixed(0)}%</b></div></div></div>
 <div class="card"><div class="row"><h2>🤖 Smart insights</h2><button class="btn sm" onclick="A.go('ai')">Ask AI</button></div>${ins.length?ins.map(i=>`<div class="item"><span>${esc(i[1])}</span><span class="chip ${i[0]=='g'?'g':i[0]=='w'?'w':''}">${i[0]=='g'?'good':i[0]=='w'?'watch':'alert'}</span></div>`).join(''):'<p class="mu">Add transactions to get insights.</p>'}</div>
 <div class="card"><h2>Spending this month</h2>${catBars()}</div>
 <div class="card"><h2>6-month trend</h2>${trend()}</div>
 <div class="card"><div class="row"><h2>Upcoming auto-debits</h2><button class="btn s sm" onclick="A.addBill()">+ Add</button></div>${up.length?up.map(b=>`<div class="item"><div><b>${esc(b.n)}</b><br><small>${b.d==0?'Today':'in '+b.d+'d'} · ${esc(S.banks[b.b]?.n||'')}</small></div><div class="row"><b>${fmt(b.a)}</b>${b.loan?'':`<button class="ic" onclick="A.del('bills',${S.bills.indexOf(S.bills.find(x=>x.n==b.n&&x.a==b.a))})">✕</button>`}</div></div>`).join(''):'<p class="mu">No bills added.</p>'}</div>
 ${S.sample?'<div class="note">Showing sample data. <a href="#" onclick="A.clear();return false" style="color:var(--ac)">Clear sample &amp; start fresh</a></div>':''}`}
function txs(){const l=[...S.tx].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,60);
 return`<div class="card"><h2>Transactions</h2>${l.length?l.map(x=>`<div class="item"><div><b>${esc(x.n||x.c)}</b><br><small>${x.d} · ${esc(x.c)} · ${esc(S.banks[x.b]?.n||'')}</small></div><div class="row"><b class="${x.t=='income'?'pos':x.t=='expense'?'neg':''}">${x.t=='income'?'+':'-'}${fmt(x.a)}</b><button class="ic" onclick="A.delTx('${x.id}')">✕</button></div></div>`).join(''):'<p class="mu">Nothing yet – tap + to add.</p>'}</div>`}
A.delTx=id=>{S.tx=S.tx.filter(x=>x.id!=id);save();render()};
const FIX=['Rent','Bills','EMI'],EM={Food:'🍔',Transport:'🚌',Shopping:'🛍️',Health:'💊',Fun:'🎬',Other:'🧩'};
const dayTotal=d=>sum(S.tx.filter(x=>x.d==d&&x.t=='expense'&&!FIX.includes(x.c)));
const nper=l=>{const r=l.rate/1200;if(l.emi<=0)return Infinity;if(!r)return l.out/l.emi;const x=1-r*l.out/l.emi;return x<=0?Infinity:-Math.log(x)/Math.log(1+r)};
A.quick=c=>{const a=parseFloat($('#qa').value);if(!S.banks.length){A.addBank();return}if(!(a>0))return;const b=Math.max(0,S.banks.findIndex(x=>x.role=='Expense'));S.tx.push({id:'t'+Date.now(),t:'expense',a,c,b,d:ld(),n:$('#qn').value||c});save();render()};
A.limit=()=>form('Daily budget',[{k:'a',l:'Daily limit (₹)',t:'number',v:S.dl}],v=>{if(v.a>0)S.dl=v.a});
A.pay=i=>{const l=S.loans[i],pi=l.out*l.rate/1200,pp=Math.min(l.out,Math.max(0,l.emi-pi));l.out=Math.max(0,l.out-pp);S.tx.push({id:'t'+Date.now(),t:'expense',a:l.emi,c:'EMI',b:l.b,d:ld(),n:l.n+' EMI'});save();render()};
A.delL=i=>A.del('loans',i);
A.addLoan=()=>{if(!S.banks.length)return A.addBank();form('Add loan',[{k:'n',l:'Loan name (Car, Home, Personal…)'},{k:'orig',l:'Original loan amount (₹)',t:'number'},{k:'out',l:'Outstanding now (₹)',t:'number'},{k:'rate',l:'Interest % p.a.',t:'number'},{k:'emi',l:'Monthly EMI (₹)',t:'number'},{k:'day',l:'EMI date (1-28)',t:'number',v:5},{k:'b',l:'Debited from',o:bankOpts()}],v=>{if(v.n&&v.out>0&&v.emi>0)S.loans.push({...v,b:+v.b,day:Math.min(28,Math.max(1,v.day||1)),orig:v.orig||v.out})})};
function daily(){const t=ld(),tot=dayTotal(t),lim=S.dl,p=Math.min(100,tot/lim*100),now=new Date(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),ds=[0,1,2,3,4,5,6].map(i=>{const d=new Date();d.setDate(d.getDate()-(6-i));const k=new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);return{k,l:d.toLocaleString('en',{weekday:'short'}).slice(0,2),v:dayTotal(k)}}),mx=Math.max(lim,...ds.map(x=>x.v))*1.15,mtd=sum(M(cm).t.filter(x=>x.t=='expense'&&!FIX.includes(x.c))),avg=mtd/now.getDate(),td=S.tx.filter(x=>x.d==t&&x.t=='expense'),w=300/7;
return`<div class='card hero'><div class='row'><small>Today's spending</small><button class='btn sm' style='background:rgba(255,255,255,.22)' onclick='A.limit()'>Budget ${fmt(lim)}</button></div><div class='big'>${fmt(tot)}</div><div class='bar' style='background:rgba(255,255,255,.25);margin:8px 0'><i style='width:${p}%;background:${tot>lim?'#ffd1dc':'#fff'}'></i></div><small>${tot>lim?'Over budget by '+fmt(tot-lim):fmt(lim-tot)+' left today'}</small></div><div class='card'><h2>⚡ Quick add today</h2><input id='qa' type='number' inputmode='decimal' placeholder='Amount ₹'><input id='qn' placeholder='Note (optional)' style='margin-top:8px'><div class='chips'>${Object.keys(EM).map(c=>`<button data-c='${c}' onclick='A.quick(this.dataset.c)'>${EM[c]} ${c}</button>`).join('')}</div><div class='note'>Tap a category to save. Rent, bills and EMIs are tracked separately.</div></div><div class='card'><h2>Last 7 days</h2><svg viewBox='0 0 300 120' style='width:100%'>${ds.map((x,i)=>`<rect x='${i*w+10}' y='${100-x.v/mx*90}' width='22' height='${x.v/mx*90}' rx='5' fill='${x.v>lim?'var(--rd)':'var(--ac)'}'/><text x='${i*w+21}' y='116' font-size='10' text-anchor='middle' fill='var(--mu)'>${x.l}</text>`).join('')}<line x1='0' x2='300' y1='${100-lim/mx*90}' y2='${100-lim/mx*90}' stroke='var(--am)' stroke-dasharray='4 4'/></svg><div class='row' style='margin-top:8px'><div><small>Avg / day</small><br><b>${fmt(avg)}</b></div><div><small>Month so far</small><br><b>${fmt(mtd)}</b></div><div><small>Projected month</small><br><b>${fmt(avg*dim)}</b></div></div></div><div class='card'><h2>Today</h2>${td.length?td.map(x=>`<div class='item'><div><b>${esc(x.n||x.c)}</b><br><small>${esc(x.c)}</small></div><div class='row'><b class='neg'>-${fmt(x.a)}</b><button class='ic' data-id='${x.id}' onclick='A.delTx(this.dataset.id)'>✕</button></div></div>`).join(''):`<p class='mu'>No spends logged today.</p>`}</div>`+txs()}
function loans(){const c=calc(),L=S.loans,pr=[...L].sort((a,b)=>b.rate-a.rate)[0],ns=L.map(nper),fin=Math.max(0,...ns.filter(isFinite)),intr=L.reduce((s,l,i)=>isFinite(ns[i])?s+l.emi*ns[i]-l.out:s,0);
return`<div class='card hero'><small>Total loans outstanding</small><div class='big'>${fmt(c.debt)}</div><small>Monthly EMI ${fmt(c.emi)}${c.cur.inc?` · ${(c.emi/c.cur.inc*100).toFixed(0)}% of income`:''}</small><div class='grid3'><div class='stat'><small>Loans</small><b>${L.length}</b></div><div class='stat'><small>Debt-free in</small><b>${L.length&&fin?Math.ceil(fin)+' mo':'–'}</b></div><div class='stat'><small>Interest left</small><b>${fmt(intr)}</b></div></div></div><div class='row' style='margin-bottom:10px'><h2 style='margin:0'>Existing loans</h2><button class='btn sm' onclick='A.addLoan()'>+ Loan</button></div>${L.map((l,i)=>{const n=ns[i],p=Math.min(100,Math.max(0,(1-l.out/(l.orig||l.out))*100)),d=days(nextDue(l));return`<div class='card'><div class='row'><div><b>${esc(l.n)}</b><br><small>${l.rate}% · EMI ${fmt(l.emi)} on day ${l.day} · ${esc(S.banks[l.b]?.n||'')}</small></div><div style='text-align:right'><div style='font-size:20px;font-weight:700'>${fmt(l.out)}</div><small>outstanding</small></div></div><div class='bar' style='margin:10px 0 6px'><i style='width:${p}%;background:var(--ac2)'></i></div><div class='row'><small>${p.toFixed(0)}% repaid · ${isFinite(n)?Math.ceil(n)+' EMIs left':'EMI is below monthly interest!'}</small><span class='chip ${d<=3?'w':''}'>due in ${d}d</span></div><div class='row' style='margin-top:10px'><button class='btn s sm' onclick='A.pay(${i})'>Mark EMI paid</button><button class='ic' onclick='A.delL(${i})'>Remove</button></div></div>`}).join('')||`<p class='mu'>No loans added – tap + Loan.</p>`}${pr&&L.length>1?`<div class='card'><h2>Prepay priority</h2><p style='margin:0'>Highest rate first: <b>${esc(pr.n)}</b> (${pr.rate}%). Extra cash goes here before lower-rate loans.</p></div>`:''}<div class='card'><h2>🤖 Loan advisor</h2><div id='aiout' class='ai mu'>Ask whether to prepay or invest, and how to clear loans faster.</div><button class='btn' style='margin-top:10px' data-p='Review my loans. Should I prepay any loan or invest my surplus instead? Compare loan interest rates with realistic investment returns, tell me which loan to prepay first, and how much extra per month would make me debt-free sooner.' onclick='A.q(this.dataset.p)'>Ask AI</button></div>`}
function banks(){return`<div class="row" style="margin-bottom:10px"><h2 style="margin:0">Your banks</h2><div class="row"><button class="btn s sm" onclick="A.addBank()">+ Bank</button><button class="btn sm" onclick="autoAssign()">✨ Auto-assign</button></div></div>
 ${S.banks.map((b,i)=>`<div class="card"><div class="row"><div><b>${esc(b.n)}</b><br><small>${b.rate}% interest · ${b.cash}% cashback · min ${fmt(b.min)}</small></div><div style="text-align:right"><div style="font-size:20px;font-weight:700">${fmt(bal(i))}</div><button class="ic" onclick="A.del('banks',${i})">Remove</button></div></div>
 <div class="row" style="margin-top:8px"><select onchange="A.role(${i},this.value);render()" style="width:auto">${ROLES.map(r=>`<option ${r==b.role?'selected':''}>${r}</option>`).join('')}</select><small style="text-align:right">${why[b.role]}</small></div>${bal(i)<b.min?'<div class="chip w" style="margin-top:8px">Below minimum balance – fees likely</div>':''}</div>`).join('')||'<p class="mu">Add your bank accounts.</p>'}
 <div class="card"><h2>🤖 Which bank for what?</h2><div id="aiout" class="ai mu">Get a personalised split for expenses, investments and auto-debits.</div><button class="btn" style="margin-top:10px" onclick="A.q('Which of my banks should I use for daily expenses, for investments/SIPs, and for auto-debits? Check bill coverage and minimum balances and flag any risks.',$('#aiout'))">Ask AI</button></div>`}
function invest(){const c=calc(),al=RISK[S.risk],d=Math.max(0,c.deploy),ds=Math.max(0,c.cur.inc-c.cur.exp-c.cur.inv);
 return`<div class="card hero"><small>Deployable surplus now</small><div class="big">${fmt(d)}</div><small>Cash ${fmt(c.liquid)} − 3-mo buffer ${fmt(c.buffer)} − bills (30d) ${fmt(c.bills)}</small></div>
 <div class="card"><h2>Risk profile</h2><div class="seg">${Object.keys(RISK).map(r=>`<button class="${r==S.risk?'on':''}" onclick="A.risk('${r}')">${r[0].toUpperCase()+r.slice(1)}</button>`).join('')}</div>
 <h2 style="margin-top:14px">Suggested allocation ${d?'':'<span class="chip w">no surplus yet</span>'}</h2>${al.map((a,i)=>`<div style="margin:10px 0"><div class="row"><span>${a[0]} · ${a[1]}%</span><b>${fmt(d*a[1]/100)}</b></div><div class="bar"><i style="width:${a[1]*1.8}%;background:${AC[i%5]}"></i></div></div>`).join('')}
 <div class="note">Monthly free cash flow: <b>${fmt(ds)}</b> – automate it as a SIP from your ${esc(S.banks.find(b=>b.role=='Investment')?.n||'investment')} account right after payday. Educational guidance only, not licensed advice.</div></div>
 <div class="card"><div class="row"><h2>🎯 Goals</h2><button class="btn s sm" onclick="A.addGoal()">+ Goal</button></div>${S.goals.map((g,i)=>{const p=Math.min(100,g.s/g.t*100);return`<div style="margin:12px 0"><div class="row"><b>${esc(g.n)}</b><div><small>${fmt(g.s)} / ${fmt(g.t)}</small> <button class="ic" onclick="A.fund(${i})">＋</button><button class="ic" onclick="A.del('goals',${i})">✕</button></div></div><div class="bar"><i style="width:${p}%;background:var(--ac2)"></i></div><small>${p.toFixed(0)}% · ${ds>0?Math.ceil(Math.max(0,g.t-g.s)/ds)+' months at current surplus':'add income to estimate'}</small></div>`}).join('')||'<p class="mu">Set a goal.</p>'}</div>
 <div class="card"><h2>🤖 AI wealth plan</h2><div id="aiout" class="ai mu">Ask for a plan to put your surplus to work.</div><button class="btn" style="margin-top:10px" onclick="A.q('I have a surplus. Give me a wealth-creation plan: exactly where to invest my deployable amount and my monthly SIP, matched to my risk profile and goals, and what to do first.',$('#aiout'))">Get investment plan</button></div>`}
function aiv(){const ch=['Where should I invest my surplus?','Why did my spending change?','How can I save ₹5,000 more a month?','Which bank for which payment?','Prepay my loan or invest?'];
 return`<div class="card"><h2>🤖 AI advisor</h2><div class="chips">${ch.map(c=>`<button onclick="A.q('${c}')">${c}</button>`).join('')}</div>${chat.map(m=>`<div class="msg ${m.r}">${m.r=='u'?esc(m.t):md(m.t)}</div>`).join('')}<div class="row" style="margin-top:10px"><input id="q" placeholder="Ask about your money…" onkeydown="if(event.key=='Enter')A.q()"><button class="btn" onclick="A.q()">Send</button></div><div class="note">Answers use your tracked data and are educational, not licensed financial advice.</div></div>`}
function render(){const t=[['home','🏠','Home'],['tx','📅','Daily'],['banks','🏦','Banks'],['loans','💳','Loans'],['inv','📈','Invest'],['ai','✨','AI']];
 $('#app').innerHTML=`<header><h1>💸 Finance Manager</h1><button class="ic" onclick="A.theme()" title="Theme">🌓</button></header>${{home,tx:daily,banks,loans,inv:invest,ai:aiv}[view]()}`+`<nav>${t.map(x=>`<button class="${view==x[0]?'on':''}" onclick="A.go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`+(view=='home'||view=='tx'?'<button class="fab" onclick="A.addTx()">+</button>':'')}
render();
</script></body></html>
