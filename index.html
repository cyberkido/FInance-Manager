<script>
const $=s=>document.querySelector(s),K_ACC='fm_accounts_v10',ld=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmt=n=>(n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.toISOString().slice(0,10),mk=d=>d.slice(0,7);
const CATS={Food:'#ff7675',Petrol:'#00cec9',Transport:'#74b9ff',Rent:'#a29bfe',Shopping:'#fd79a8',Bills:'#fdcb6e',Health:'#55efc4',Fun:'#e17055',EMI:'#e84393',Investments:'#00b8a0',Other:'#b2bec3'};
const ROLES=['Expense','Savings','Investment','Auto-debit','Backup'];
const RISK={conservative:[['Liquid fund / FD',45],['Debt / PPF',30],['Gold',15],['Index fund SIP',10]],balanced:[['Liquid fund / FD',20],['Debt / PPF',20],['Gold',15],['Index fund SIP',45]],aggressive:[['Liquid fund / FD',10],['Gold',10],['Index fund SIP',55],['Flexi/Mid-cap fund',25]]};
const AC=['#6c5ce7','#00b8a0','#f2a31b','#ef476f','#4aa8ff'];

// TOTP Algorithm
const B32_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function generateBase32Secret(length = 16) {
  let secret = '';
  for (let i = 0; i < length; i++) { secret += B32_CHARS.charAt(Math.floor(Math.random() * B32_CHARS.length)); }
  return secret;
}
function base32ToBytes(base32) {
  let bits = '', bytes = [];
  for (let i = 0; i < base32.length; i++) {
    let val = B32_CHARS.indexOf(base32.charAt(i).toUpperCase());
    if (val !== -1) bits += val.toString(2).padStart(5, '0');
  }
  for (let i = 0; i + 8 <= bits.length; i += 8) { bytes.push(parseInt(bits.substr(i, 8), 2)); }
  return new Uint8Array(bytes);
}
async function getTotpToken(secret, timeStep = 30) {
  const epoch = Math.floor(Date.now() / 1000);
  const time = Math.floor(epoch / timeStep);
  const buffer = new ArrayBuffer(8);
  const view = new DataView(buffer);
  view.setUint32(4, time, false);
  const keyBytes = base32ToBytes(secret);
  const cryptoKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  const signature = await crypto.subtle.sign('HMAC', cryptoKey, buffer);
  const sigBytes = new Uint8Array(signature);
  const offset = sigBytes[sigBytes.length - 1] & 0xf;
  const binary = ((sigBytes[offset] & 0x7f) << 24) | ((sigBytes[offset + 1] & 0xff) << 16) | ((sigBytes[offset + 2] & 0xff) << 8) | (sigBytes[offset + 3] & 0xff);
  let otp = (binary % 1000000).toString();
  return otp.padStart(6, '0');
}
async function verifyTotpToken(secret, userToken) {
  const currentToken = await getTotpToken(secret);
  return currentToken === userToken.trim();
}

let accounts = [], currentAccId = '', currentUser = null, S = null, view='home', chat=[], busy=false;
let authStep = 'login', tempEmail = '', tempPass = '', tempSecret = '';
let projTypeFilter = 'All';
let summaryStart = ld(), summaryEnd = ld();

function seed(){
  let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280,tx=[],now=new Date();
  for(let m=5;m>=0;m--){
    const d=new Date(now.getFullYear(),now.getMonth()-m,1),y=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0');
    tx.push({id:'i'+m,t:'income',a:65000,c:'Salary',b:0,d:`${y}-${mo}-01`,n:'Salary'});
    tx.push({id:'r'+m,t:'expense',a:15000,c:'Rent',b:0,d:`${y}-${mo}-02`,n:'Rent'});
    [['Food',9000],['Petrol',3500],['Transport',4000],['Shopping',6000],['Bills',3500],['Health',1500],['Fun',3000]].forEach(([c,v],i)=>{
      const day=Math.min(27,3+i*3);if(m===0&&day>now.getDate())return;
      tx.push({id:c+m,t:'expense',a:Math.round(v*(.8+rnd()*.5)),c,b:i%2?1:0,d:`${y}-${mo}-${String(day).padStart(2,'0')}`,n:c})
    });
    if(m>0)tx.push({id:'v'+m,t:'invest',a:5000,c:'Index Fund SIP',b:2,d:`${y}-${mo}-05`,n:'Nifty 50 SIP'})
  }
  return{
    tx,risk:'balanced',sample:true,
    banks:[{n:'Bank A – Salary',open:60000,rate:3,cash:0,min:10000,role:'Auto-debit'},{n:'Bank B – Cashback Card',open:20000,rate:2.7,cash:5,min:0,role:'Expense'},{n:'Bank C – High Interest',open:80000,rate:7,cash:0,min:0,role:'Savings'}],
    bills:[{n:'Rent',a:15000,day:2,b:0},{n:'Phone & Internet',a:999,day:12,b:0}],
    healthInsurance:{n:'Family Health Plan', premium:2500, sumInsured:1000000, b:0},
    termInsurance:{n:'Term Life Cover', premium:1800, sumInsured:10000000, b:0},
    investments:[
      {id:'inv3', n:'Index Fund SIP', a:5000, type:'SIP / Equity', rate:12, val:60000, invYears:10, waitYears:10, b:2},
      {id:'inv4', n:'KSFE Chitty / Post Office', a:0, type:'Lumpsum / Fixed Maturity', rate:8, val:100000, maturityVal:250000, waitYears:3, b:0}
    ],
    goals:[{n:'Emergency fund',t:150000,s:60000},{n:'Travel',t:80000,s:22000}],
    loans:[{n:'Car loan',orig:600000,out:380000,rate:9.2,emi:14500,day:7,b:0},{n:'Personal loan',orig:200000,out:0,rate:13,emi:7200,day:15,b:0}],
    dl:1200,
    budgets:{Food:10000,Petrol:4000,Transport:5000,Shopping:7000,Bills:4000,Health:2000,Fun:4000,Rent:15000}
  };
}

function initAccounts(){
  try{
    accounts = JSON.parse(localStorage.getItem(K_ACC)) || [];
    currentUser = JSON.parse(localStorage.getItem('fm_current_user')) || null;
  }catch(e){ accounts = []; currentUser = null; }

  if(currentUser){
    if(!accounts.length){ accounts = [{id:'default', name:'Personal'}]; }
    currentAccId = localStorage.getItem('fm_current_acc') || accounts[0].id;
    loadState();
  }
}

function loadState(){
  try{ S = JSON.parse(localStorage.getItem('fm_state_' + currentAccId)); }catch(e){ S = null; }
  if(!S){ S = seed(); }
  S.loans = S.loans || []; S.investments = S.investments || []; S.dl = S.dl || 1200;
  S.healthInsurance = S.healthInsurance || {n:'Health Insurance', premium:0, sumInsured:0, b:0};
  S.termInsurance = S.termInsurance || {n:'Term Insurance', premium:0, sumInsured:0, b:0};
  S.budgets = S.budgets || {Food:10000,Petrol:4000,Transport:5000,Shopping:7000,Bills:4000,Health:2000,Fun:4000,Rent:15000};
}

const save=()=>{
  try{
    if(currentAccId && S) localStorage.setItem('fm_state_' + currentAccId, JSON.stringify(S));
    localStorage.setItem(K_ACC, JSON.stringify(accounts));
    localStorage.setItem('fm_current_acc', currentAccId);
    if(currentUser) localStorage.setItem('fm_current_user', JSON.stringify(currentUser));
  }catch(e){}
};

const bal=i=>S&&S.banks[i]?S.banks[i].open+S.tx.filter(x=>x.b==i).reduce((s,x)=>s+(x.t=='income'?x.a:-x.a),0):0;
const sum=a=>a.reduce((s,x)=>s+x.a,0),cm=mk(ld());
function months(n){const o=[],now=new Date();for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);o.push({k:mk(iso(new Date(d.getTime()-d.getTimezoneOffset()*6e4))),l:d.toLocaleString('en',{month:'short'})})}return o}
function M(k){const t=(S?S.tx:[]).filter(x=>mk(x.d)==k);return{inc:sum(t.filter(x=>x.t=='income')),exp:sum(t.filter(x=>x.t=='expense')),inv:sum(t.filter(x=>x.t=='invest')),t}}
function nextDue(b){const n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),b.day||5);if(d<new Date(n.getFullYear(),n.getMonth(),n.getDate()))d.setMonth(d.getMonth()+1);return d}
const days=d=>Math.round((d-new Date(new Date().setHours(0,0,0,0)))/864e5);
const allBills=()=>(S?S.bills:[]).concat((S?S.loans:[]).filter(l=>l.out>0).map(l=>({n:l.n+' EMI',a:l.emi,day:l.day,b:l.b,loan:1})));

function calc(){
  const cur=M(cm),ms=months(4).slice(0,3).map(m=>M(m.k).exp).filter(x=>x>0),avg=ms.length?ms.reduce((a,b)=>a+b)/ms.length:cur.exp,
  liquid=(S?S.banks:[]).reduce((s,_,i)=>s+bal(i),0),
  investedVal=(S?S.investments:[]).reduce((s,inv)=>s+(inv.val||0),0) + sum((S?S.tx:[]).filter(x=>x.t=='invest')),
  insCommitment = (S.healthInsurance?.premium || 0) + (S.termInsurance?.premium || 0),
  sipCommitment = (S?S.investments:[]).filter(inv => inv.type !== 'Lumpsum / Fixed Maturity').reduce((s,inv)=>s+(inv.a||0),0),
  monthlyInvestCommitment = insCommitment + sipCommitment,
  bills=allBills().filter(b=>days(nextDue(b))<=30).reduce((s,b)=>s+b.a,0),buffer=avg*3;
  
  return{
    cur,avg,liquid,invested:investedVal,monthlyInvestCommitment,bills,buffer,
    deploy:liquid-buffer-bills,
    debt:(S?S.loans:[]).reduce((s,l)=>s+l.out,0),
    emi:(S?S.loans:[]).filter(l=>l.out>0).reduce((s,l)=>s+l.emi,0),
    nw:liquid+investedVal-(S?S.loans:[]).reduce((s,l)=>s+l.out,0),
    rate:cur.inc?Math.max(0,(cur.inc-cur.exp)/cur.inc*100):0
  }
}

function getAggregates(){
  const start = summaryStart || ld();
  const end = summaryEnd || ld();
  const txs = S ? S.tx : [];
  const filtered = txs.filter(x => x.d >= start && x.d <= end);
  const inc = sum(filtered.filter(x => x.t == 'income'));
  const exp = sum(filtered.filter(x => x.t == 'expense'));
  const sav = inc - exp;
  return { inc, exp, sav };
}

function categoryBalancesWidget(){
  const c=calc().cur, spent={Food:0, Petrol:0, Fun:0};
  c.t.filter(x=>x.t=='expense').forEach(x=>{ if(spent[x.c]!==undefined) spent[x.c]+=x.a; });
  const foodB=S.budgets.Food||10000, petrolB=S.budgets.Petrol||4000, funB=S.budgets.Fun||4000;
  return `<div class="card">
    <div class="row"><h2>⛽ Monthly Expense Allowances</h2><button class="btn s sm" onclick="A.setBudgets()">⚙️ Edit Budgets</button></div>
    <div class="grid3" style="margin-top:10px">
      <div class="stat"><small>Petrol Bal</small><b>${fmt(petrolB - spent.Petrol)}</b><small class="mu">Spent: ${fmt(spent.Petrol)} / ${fmt(petrolB)}</small></div>
      <div class="stat"><small>Food Bal</small><b>${fmt(foodB - spent.Food)}</b><small class="mu">Spent: ${fmt(spent.Food)} / ${fmt(foodB)}</small></div>
      <div class="stat"><small>Entertainment</small><b>${fmt(funB - spent.Fun)}</b><small class="mu">Spent: ${fmt(spent.Fun)} / ${fmt(funB)}</small></div>
    </div></div>`;
}

function aggregatedSummaryWidget(){
  const ag = getAggregates();
  return `<div class="card">
    <div class="row"><h2>📊 Income, Expenses & Savings Summary</h2></div>
    <div class="row" style="gap:6px;margin:8px 0">
      <div><label style="margin:0;font-size:10px">From Date</label><input type="date" id="sumStart" value="${summaryStart}" onchange="A.setSumStart(this.value)" style="padding:6px;font-size:12px"></div>
      <div><label style="margin:0;font-size:10px">To Date</label><input type="date" id="sumEnd" value="${summaryEnd}" onchange="A.setSumEnd(this.value)" style="padding:6px;font-size:12px"></div>
    </div>
    <div class="grid3" style="text-align:center;margin-top:10px">
      <div class="stat"><small><b>Total Income</b></small><br><b class="pos" style="font-size:16px">${fmt(ag.inc)}</b></div>
      <div class="stat"><small><b>Total Expenses</b></small><br><b class="neg" style="font-size:16px">${fmt(ag.exp)}</b></div>
      <div class="stat"><small><b>Net Savings</b></small><br><b style="font-size:16px">${fmt(ag.sav)}</b></div>
    </div>
  </div>`;
}

function home(){
  const c=calc();
  return`<div class="card hero"><small>Total Net Worth</small><div class="big">${fmt(c.nw)}</div>
  <small>Liquid Cash ${fmt(c.liquid)} · Investments ${fmt(c.invested)} · Debt −${fmt(c.debt)}</small>
  <div class="grid3">
    <div class="stat"><small>Income</small><b>${fmt(c.cur.inc)}</b></div>
    <div class="stat"><small>Spent</small><b>${fmt(c.cur.exp)}</b></div>
    <div class="stat"><small>Monthly EMI</small><b>${fmt(c.emi)}</b></div>
  </div></div>
  ${categoryBalancesWidget()}
  ${aggregatedSummaryWidget()}
  <div class="card"><h2>📈 Investment & Insurance Monthly Commitments</h2>
  <div class="row"><div><small>Monthly Outflows</small><br><b style="font-size:18px">${fmt(c.monthlyInvestCommitment)}</b></div><button class="btn s sm" onclick="A.go('inv')">Manage in Invest Tab</button></div></div>`;
}

function daily(){
  const t=ld(),tot=dayTotal(t),lim=S.dl,p=Math.min(100,tot/lim*100),td=S.tx.filter(x=>x.d==t&&x.t=='expense');
  return `<div class="card hero"><div class="row"><small>Today's spending</small><button class="btn sm" style="background:rgba(255,255,255,.22)" onclick="A.limit()">Budget ${fmt(lim)}</button></div><div class="big">${fmt(tot)}</div><div class="bar" style="background:rgba(255,255,255,.25);margin:8px 0"><i style="width:${p}%;background:${tot>lim?'#ffd1dc':'#fff'}"></i></div><small>${tot>lim?'Over budget by '+fmt(tot-lim):fmt(lim-tot)+' left today'}</small></div>
  <div class="card"><h2>⚡ Quick Add Spend</h2><input id="qa" type="number" inputmode="decimal" placeholder="Amount ₹"><input id="qn" placeholder="Note (optional)" style="margin-top:8px"><div class="chips">${Object.keys(EM).map(c=>`<button data-c="${c}" onclick="A.quick(this.dataset.c)">${EM[c]} ${c}</button>`).join('')}</div></div>
  <div class="card"><h2>Today Spends</h2>${td.length?td.map(x=>`<div class="item"><div><b>${esc(x.n||x.c)}</b><br><small>${esc(x.c)}</small></div><div class="row"><b class="neg">-${fmt(x.a)}</b><button class="ic" data-id="${x.id}" onclick="A.delTx(this.dataset.id)">✕</button></div></div>`).join(''):'<p class="mu">No spends logged today.</p>'}</div>`+txs();
}

function txs(){
  const l=[...S.tx].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,60);
  return`<div class="card"><h2>Transaction History</h2>${l.length?l.map(x=>`<div class="item"><div><b>${esc(x.n||x.c)}</b><br><small>${x.d} · ${esc(x.c)}</small></div><div class="row"><b class="${x.t=='income'?'pos':x.t=='expense'?'neg':''}">${x.t=='income'?'+':'-'}${fmt(x.a)}</b><button class="ic" onclick="A.delTx('${x.id}')">✕</button></div></div>`).join(''):'<p class="mu">No transactions.</p>'}</div>`;
}

function loans(){
  const c=calc(),L=S.loans,ns=L.map(nper);

function invest(){
  const c=calc(), invs=S.investments||[];
  
  // Filter investments based on dropdown selection
  const filteredInvs = invs.filter(inv => {
    if(projTypeFilter === 'All') return true;
    return inv.type === projTypeFilter;
  });

  // Calculate filtered projected future corpus
  let totalProjectedCorpus = 0;
  let totalCurrentVal = 0;
  let totalMonthlySIP = 0;

  filteredInvs.forEach(inv => {
    totalCurrentVal += (inv.val || 0);
    totalMonthlySIP += (inv.a || 0);

    if(inv.type === 'Lumpsum / Fixed Maturity') {
      const waitYears = Math.max(0, inv.waitYears || 3);
      const r = (inv.rate || 8) / 100;
      const maturity = inv.maturityVal > 0 ? inv.maturityVal : ((inv.val || 0) * Math.pow(1 + r, waitYears));
      totalProjectedCorpus += maturity;
    } else {
      const invYears = Math.max(0, inv.invYears || 10);
      const waitYears = Math.max(0, inv.waitYears || 10);
      const r = (inv.rate || 12) / 100 / 12;

      const months1 = invYears * 12;
      let futureVal1 = (inv.val || 0) * Math.pow(1 + r, months1);
      if(r > 0) futureVal1 += (inv.a || 0) * ((Math.pow(1 + r, months1) - 1) / r);
      else futureVal1 += (inv.val || 0) + (inv.a || 0) * months1;

      const months2 = waitYears * 12;
      const finalVal = futureVal1 * Math.pow(1 + r, months2);
      totalProjectedCorpus += finalVal;
    }
  });

  const sipOutflow = invs.filter(i=>i.type=='SIP / Equity').reduce((s,i)=>s+i.a,0);
  const ppfOutflow = invs.filter(i=>i.type=='PPF / Debt').reduce((s,i)=>s+i.a,0);
  const lumpsumOutflow = invs.filter(i=>i.type=='Lumpsum / Fixed Maturity').reduce((s,i)=>s+i.a,0);

  const term = S.termInsurance || {n:'Term Insurance', premium:0, sumInsured:0};

  return `<div class="card hero"><small>Current Total Net Worth</small><div class="big">${fmt(c.nw)}</div><small>Total Investment Value: ${fmt(c.invested)} · Monthly Outflows: ${fmt(c.monthlyInvestCommitment)}</small></div>

    </div>
  </div>

  <div class="card">
    <h2>📊 Monthly Outflow Breakdown</h2>
    <div class="grid3" style="text-align:center;margin-top:10px">
      <div class="stat"><small>SIP / Equity</small><b>${fmt(sipOutflow)}</b></div>
      <div class="stat"><small>PPF / Debt</small><b>${fmt(ppfOutflow)}</b></div>

  </div>
  
  <div class="card">
    <div class="row"><h2>📈 Filtered Portfolio Projection</h2></div>
    <div class="row" style="margin:8px 0"><small>Filter Category:</small><select onchange="projTypeFilter=this.value;render()" style="width:auto"><option ${projTypeFilter=='All'?'selected':''}>All Investments</option><option ${projTypeFilter=='SIP / Equity'?'selected':''}>SIP / Equity</option><option ${projTypeFilter=='PPF / Debt'?'selected':''}>PPF / Debt</option><option ${projTypeFilter=='FD / RD'?'selected':''}>FD / RD</option><option ${projTypeFilter=='Lumpsum / Fixed Maturity'?'selected':''}>Lumpsum / Fixed Maturity (KSFE/PostOffice)</option></select></div>
    <div class="row" style="margin:10px 0"><div><small>Current Filtered Corpus</small><br><b>${fmt(totalCurrentVal)}</b></div><div><small>Monthly SIP (Filtered)</small><br><b>${fmt(totalMonthlySIP)}</b></div><div><small>Projected Future Value</small><br><b class="pos" style="font-size:18px">${fmt(totalProjectedCorpus)}</b></div></div>

function generateAiResponse(input) {
  const text = input.toLowerCase();
  const c = calc();
  const activeLoans = (S.loans || []).filter(l => l.out > 0);
  const totalDebt = c.debt;
  const liquid = c.liquid;
  const deploy = c.deploy;

  // Extract amount mentioned in input if any
  let numMatch = text.match(/(\d+[\d,]*\s*k?)/i);
  let valMentioned = 0;
  if(numMatch) {
    let raw = numMatch[0].toLowerCase().replace(/,/g,'');
    if(raw.includes('k')) {
      valMentioned = parseFloat(raw) * 1000;
    } else {
      valMentioned = parseFloat(raw);
    }
  }

  // Debt & Buffer Check Logic
  if(text.includes('buffer') || text.includes('invest') || text.includes('loan') || text.includes('emi') || text.includes('extra') || valMentioned > 0) {
    if(activeLoans.length > 0) {
      let mainLoan = activeLoans.reduce((prev, curr) => (prev.rate > curr.rate) ? prev : curr, activeLoans[0]);
      let amountStr = valMentioned > 0 ? fmt(valMentioned) : 'your buffer cash';
      return `I noticed you have active loans (such as <b>${esc(mainLoan.n)}</b> with total outstanding debt of ${fmt(totalDebt)} and monthly EMI of ${fmt(c.emi)}).<br><br>💡 <b>Smart Advice:</b> If you have ${amountStr} available, it is recommended to use it towards clearing or prepaying your high-interest loan first instead of investing it all. Clearing loan burden saves interest costs and relieves monthly financial pressure!`;
    } else {
      let amountStr = valMentioned > 0 ? fmt(valMentioned) : 'your extra money';
      return `Great news! You have no active loans or debt burden. You can safely allocate ${amountStr} into your high-return investments (like your active SIPs) or direct it towards your financial goals.`;
    }
  }

  if(text.includes('goal') || text.includes('target')) {
    if(S.goals && S.goals.length > 0) {
      let gList = S.goals.map(g => `• <b>${esc(g.n)}</b>: Target ${fmt(g.t)} (Saved: ${fmt(g.s)})`).join('<br>');
      return `Here is your goal progress:<br>${gList}<br><br>Keep funding your emergency fund and goals regularly!`;
    } else {
      return `You haven't set any financial goals yet. You can add goals under the <b>Invest</b> tab!`;
    }
  }

  if(text.includes('net worth') || text.includes('balance') || text.includes('summary')) {
    return `Here is your quick summary:<br>• <b>Net Worth:</b> ${fmt(c.nw)}<br>• <b>Liquid Cash:</b> ${fmt(c.liquid)}<br>• <b>Investments:</b> ${fmt(c.invested)}<br>• <b>Total Debt:</b> ${fmt(c.debt)}<br>• <b>Monthly EMI:</b> ${fmt(c.emi)}`;
  }

  // General default smart response based on profile
  if(activeLoans.length > 0) {
    return `Based on your profile, you have a total debt of <b>${fmt(totalDebt)}</b> (EMI: <b>${fmt(c.emi)}</b>) and <b>${fmt(c.invested)}</b> in investments.<br><br>Whenever you have extra buffer cash, prioritize paying off your outstanding loans to reduce your monthly EMI burden before adding to aggressive investments.`;
  } else {
    return `Your finances look balanced! Liquid Cash: <b>${fmt(liquid)}</b>, Total Investments: <b>${fmt(c.invested)}</b> with no outstanding debt. Let me know if you need investment allocation advice!`;
  }
}

    const l = S.loans[i];
    form('Update Loan Balance', [
      {k:'out', l:'New Outstanding Amount (₹)', t:'number', v:l.out},
      {k:'emi', l:'Monthly EMI Amount (₹)', t:'number', v:l.emi}
    ], v=>{
      S.loans[i].out = v.out >= 0 ? v.out : l.out;
      S.loans[i].emi = v.emi >= 0 ? v.emi : l.emi;
      save(); render();
    });
  },
  pay(i){
    const l = S.loans[i];
    if(l && l.out > 0){
      const payAmt = Math.min(l.out, l.emi);
      S.tx.push({id:'t'+Date.now(), t:'expense', a:payAmt, c:'EMI', b:l.b||0, d:ld(), n:l.n + ' EMI'});
      l.out = Math.max(0, l.out - payAmt);
      save(); render();
    }
  },
  delL(i){ S.loans.splice(i,1); save(); render(); },
  addGoal(){
    form('Add Savings Goal', [
      {k:'n', l:'Goal Name'},
      {k:'t', l:'Target Amount (₹)', t:'number'},
      {k:'s', l:'Already Saved Amount (₹)', t:'number', v:0}
    ], v=>{
      if(v.n && v.t > 0){
        S.goals.push({n:v.n, t:v.t, s:v.s||0});
        save(); render();
      }
    });
  },
  fund(i){
    const g = S.goals[i];
    form('Fund Goal: ' + g.n, [
      {k:'a', l:'Amount to Add (₹)', t:'number'}
    ], v=>{
      if(v.a > 0){
        g.s += v.a;
        save(); render();
      }
    });
  },
  del(type, i){
    if(S[type] && S[type][i]){
      S[type].splice(i, 1);
      save(); render();
    }
  }
};

function autoAssign(){
  if(!S.banks.length) return;
  S.banks.forEach(b => {
    if(b.rate >= 6) b.role = 'Savings';
    else if(b.cash > 0) b.role = 'Expense';
    else b.role = 'Auto-debit';
  });
  save(); render();
}

function renderAuth(){
  const app = $('#app');
  if(authStep === 'login'){
    app.innerHTML = `
      <div class="card auth-container">
        <h2>🔒 Sign In to Finance Manager</h2>
        <label>Email Address</label>
        <input type="email" id="authEmail" placeholder="you@example.com" value="${tempEmail}">
        <label>Password</label>
        <input type="password" id="authPass" placeholder="••••••••" value="${tempPass}">
        <div style="margin-top:16px" class="row">
          <button class="btn s" onclick="authStep='signup';render();">Need Account?</button>
          <button class="btn" onclick="handleLogin()">Sign In</button>
        </div>
      </div>
    `;
  } else if(authStep === '2fa'){
    app.innerHTML = `
      <div class="card auth-container">
        <h2>🔐 Two-Factor Authentication</h2>
        <p class="mu">Enter the 6-digit code from your Authenticator app.</p>
        <label>2FA Code</label>
        <input type="text" id="totpCode" placeholder="123456" maxlength="6" style="font-size:20px;letter-spacing:4px;text-align:center">
        <div style="margin-top:16px" class="row">
          <button class="btn s" onclick="authStep='login';render();">Back</button>
          <button class="btn" onclick="handleVerify2FA()">Verify & Login</button>
        </div>
      </div>
    `;
  } else if(authStep === 'signup'){
    app.innerHTML = `
      <div class="card auth-container">
        <h2>✨ Create Account</h2>
        <label>Email Address</label>
        <input type="email" id="authEmail" placeholder="you@example.com">
        <label>Password</label>
        <input type="password" id="authPass" placeholder="••••••••">
        <div style="margin-top:16px" class="row">
          <button class="btn s" onclick="authStep='login';render();">Existing User?</button>
          <button class="btn" onclick="handleSignup()">Next: Setup 2FA</button>
        </div>
      </div>
    `;
  } else if(authStep === 'setup2fa'){
    app.innerHTML = `
      <div class="card auth-container">
        <h2>🛡️ Setup Authenticator</h2>
        <p class="mu">Add this secret key to your Authenticator App (Google Authenticator, Authy, 1Password):</p>
        <div class="secret-box">${tempSecret}</div>
        <label>Enter Code from Authenticator to Confirm</label>
        <input type="text" id="setupTotpCode" placeholder="123456" maxlength="6" style="font-size:20px;letter-spacing:4px;text-align:center">
        <div style="margin-top:16px" class="row">
          <button class="btn s" onclick="authStep='signup';render();">Back</button>
          <button class="btn" onclick="handleConfirm2FASetup()">Complete Registration</button>
        </div>
      </div>
    `;
  }
}

function handleLogin(){
  const email = $('#authEmail').value.trim();
  const pass = $('#authPass').value.trim();
  if(!email || !pass){ alert('Please enter email and password'); return; }

  const users = JSON.parse(localStorage.getItem('fm_users_v1')) || [];
  const found = users.find(u => u.email === email && u.pass === pass);
  if(!found){ alert('Invalid credentials'); return; }

  tempEmail = email;
  currentUser = found;
  authStep = '2fa';
  render();
}

async function handleVerify2FA(){
  const code = $('#totpCode').value.trim();
  if(!code){ alert('Enter 2FA Code'); return; }
  const valid = await verifyTotpToken(currentUser.secret, code);
  if(valid){
    localStorage.setItem('fm_current_user', JSON.stringify(currentUser));
    initAccounts();
    render();
  } else {
    alert('Invalid 2FA code. Please check your authenticator app.');
  }
}

function handleSignup(){
  const email = $('#authEmail').value.trim();
  const pass = $('#authPass').value.trim();
  if(!email || !pass){ alert('Please fill all fields'); return; }

  const users = JSON.parse(localStorage.getItem('fm_users_v1')) || [];
  if(users.some(u => u.email === email)){ alert('Account already exists'); return; }

  tempEmail = email;
  tempPass = pass;
  tempSecret = generateBase32Secret();
  authStep = 'setup2fa';
  render();
}

async function handleConfirm2FASetup(){
  const code = $('#setupTotpCode').value.trim();
  const valid = await verifyTotpToken(tempSecret, code);
  if(valid){
    const newUser = { email: tempEmail, pass: tempPass, secret: tempSecret };
    const users = JSON.parse(localStorage.getItem('fm_users_v1')) || [];
    users.push(newUser);
    localStorage.setItem('fm_users_v1', JSON.stringify(users));
    currentUser = newUser;
    localStorage.setItem('fm_current_user', JSON.stringify(currentUser));
    
    // Create first default account
    accounts = [{ id: 'acc_' + Date.now(), name: 'Personal Account' }];
    currentAccId = accounts[0].id;
    save();
    loadState();
    render();
  } else {
    alert('Invalid code. Ensure you scanned/entered the key in your authenticator app.');
  }
}

function render(){
  if(!currentUser){
    renderAuth();
    return;
  }

  const app = $('#app');
  let bodyContent = '';
  if(view === 'home') bodyContent = home();
  else if(view === 'daily') bodyContent = daily();
  else if(view === 'loans') bodyContent = loans();
  else if(view === 'banks') bodyContent = banks();
  else if(view === 'inv') bodyContent = invest();
  else if(view === 'ai') bodyContent = aiv();

  app.innerHTML = `
    <header>
      <div>
        <h1>Finance Manager</h1>
        <small>${esc(currentUser.email)}</small>
      </div>
      <div class="row" style="gap:6px">
        <button class="ic" onclick="A.theme()">🌓</button>
        <button class="btn s sm" onclick="A.logout()">Logout</button>
      </div>
    </header>
    ${bodyContent}
    <button class="fab" onclick="A.addTx()">＋</button>
    <nav>
      <button class="${view=='home'?'on':''}" onclick="A.go('home')"><span>🏠</span>Home</button>
      <button class="${view=='daily'?'on':''}" onclick="A.go('daily')"><span>📅</span>Daily</button>
      <button class="${view=='loans'?'on':''}" onclick="A.go('loans')"><span>💳</span>Loans</button>
      <button class="${view=='banks'?'on':''}" onclick="A.go('banks')"><span>🏦</span>Banks</button>
      <button class="${view=='inv'?'on':''}" onclick="A.go('inv')"><span>📈</span>Invest</button>
      <button class="${view=='ai'?'on':''}" onclick="A.go('ai')"><span>✨</span>AI Chat</button>
    </nav>
  `;

  // Auto scroll chat to bottom when rendering AI view
  if(view === 'ai') {
    const chatBox = $('#chatBox');
    if(chatBox) chatBox.scrollTop = chatBox.scrollHeight;
  }
}

initAccounts();
render();
</script>
</body>
</html>
