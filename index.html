// TOTP (Authenticator App) Algorithm
const B32_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function generateBase32Secret(length = 16) {
  let secret = '';
  for (let i = 0; i < length; i++) { secret += B32_CHARS.charAt(Math.floor(Math.random() * B32_CHARS.length)); }
  return secret;
}
function base32ToBytes(base32) {
  let bits = '', bytes = [];
  for (let i = 0; i < base32.length; i++) {
    let val = B32_CHARS.indexOf(base32.charAt(i).toUpperCase());
    if (val !== -1) bits += val.toString(2).padStart(5, '0');
  }
  for (let i = 0; i + 8 <= bits.length; i += 8) { bytes.push(parseInt(bits.substr(i, 8), 2)); }
  return new Uint8Array(bytes);
}
async function getTotpToken(secret, timeStep = 30) {
  const epoch = Math.floor(Date.now() / 1000);
  const time = Math.floor(epoch / timeStep);
  const buffer = new ArrayBuffer(8);
  const view = new DataView(buffer);
  view.setUint32(4, time, false);
  const keyBytes = base32ToBytes(secret);
  const cryptoKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  const signature = await crypto.subtle.sign('HMAC', cryptoKey, buffer);
  const sigBytes = new Uint8Array(signature);
  const offset = sigBytes[sigBytes.length - 1] & 0xf;
  const binary = ((sigBytes[offset] & 0x7f) << 24) | ((sigBytes[offset + 1] & 0xff) << 16) | ((sigBytes[offset + 2] & 0xff) << 8) | (sigBytes[offset + 3] & 0xff);
  let otp = (binary % 1000000).toString();
  return otp.padStart(6, '0');
}
async function verifyTotpToken(secret, userToken) {
  const currentToken = await getTotpToken(secret);
  return currentToken === userToken.trim();
}

let accounts = [], currentAccId = '', currentUser = null, S = null, view='home', chat=[], busy=false;
let authStep = 'login', tempEmail = '', tempPass = '', tempSecret = '';
let projYear = 2050, projCagr = 12;
let summaryFilterDate = ld(); // Calendar date filter for summary

function seed(){
  let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280,tx=[],now=new Date();
  for(let m=5;m>=0;m--){
    const d=new Date(now.getFullYear(),now.getMonth()-m,1),y=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0');
    tx.push({id:'i'+m,t:'income',a:65000,c:'Salary',b:0,d:`${y}-${mo}-01`,n:'Salary'});
    tx.push({id:'r'+m,t:'expense',a:15000,c:'Rent',b:0,d:`${y}-${mo}-02`,n:'Rent'});
    [['Food',9000],['Petrol',3500],['Transport',4000],['Shopping',6000],['Bills',3500],['Health',1500],['Fun',3000]].forEach(([c,v],i)=>{
      const day=Math.min(27,3+i*3);if(m===0&&day>now.getDate())return;
      tx.push({id:c+m,t:'expense',a:Math.round(v*(.8+rnd()*.5)),c,b:i%2?1:0,d:`${y}-${mo}-${String(day).padStart(2,'0')}`,n:c})
    });
    if(m>0)tx.push({id:'v'+m,t:'invest',a:5000,c:'Index Fund SIP',b:2,d:`${y}-${mo}-05`,n:'Nifty 50 SIP'})
  }
  return{
    tx,risk:'balanced',sample:true,
    banks:[{n:'Bank A – Salary',open:60000,rate:3,cash:0,min:10000,role:'Auto-debit'},{n:'Bank B – Cashback Card',open:20000,rate:2.7,cash:5,min:0,role:'Expense'},{n:'Bank C – High Interest',open:80000,rate:7,cash:0,min:0,role:'Savings'}],
    bills:[{n:'Rent',a:15000,day:2,b:0},{n:'Phone & Internet',a:999,day:12,b:0}],
    investments:[
      {id:'inv1', n:'Health Insurance Premium', a:2500, type:'Insurance', rate:0, val:25000, b:0},
      {id:'inv2', n:'Term Insurance Premium', a:1800, type:'Insurance', rate:0, val:18000, b:0},
      {id:'inv3', n:'Index Fund SIP', a:5000, type:'SIP / Equity', rate:12, val:60000, b:2},
      {id:'inv4', n:'PPF Monthly Contribution', a:3000, type:'PPF / Debt', rate:7.1, val:45000, b:0}
    ],
    goals:[{n:'Emergency fund',t:150000,s:60000},{n:'Travel',t:80000,s:22000}],
    loans:[{n:'Car loan',orig:600000,out:380000,rate:9.2,emi:14500,day:7,b:0},{n:'Personal loan',orig:200000,out:0,rate:13,emi:7200,day:15,b:0}],
    dl:1200,
    budgets:{Food:10000,Petrol:4000,Transport:5000,Shopping:7000,Bills:4000,Health:2000,Fun:4000,Rent:15000}
  };
}

function initAccounts(){
  try{
    accounts = JSON.parse(localStorage.getItem(K_ACC)) || [];
    currentUser = JSON.parse(localStorage.getItem('fm_current_user')) || null;
  }catch(e){ accounts = []; currentUser = null; }

  if(currentUser){
    if(!accounts.length){ accounts = [{id:'default', name:'Personal'}]; }
    currentAccId = localStorage.getItem('fm_current_acc') || accounts[0].id;
    loadState();
  }
}

function loadState(){
  try{ S = JSON.parse(localStorage.getItem('fm_state_' + currentAccId)); }catch(e){ S = null; }
  if(!S){ S = seed(); }
  S.loans = S.loans || []; S.investments = S.investments || []; S.dl = S.dl || 1200;
  S.budgets = S.budgets || {Food:10000,Petrol:4000,Transport:5000,Shopping:7000,Bills:4000,Health:2000,Fun:4000,Rent:15000};
}

const save=()=>{
  try{
    if(currentAccId && S) localStorage.setItem('fm_state_' + currentAccId, JSON.stringify(S));
    localStorage.setItem(K_ACC, JSON.stringify(accounts));
    localStorage.setItem('fm_current_acc', currentAccId);
    if(currentUser) localStorage.setItem('fm_current_user', JSON.stringify(currentUser));
  }catch(e){}
};

const bal=i=>S&&S.banks[i]?S.banks[i].open+S.tx.filter(x=>x.b==i).reduce((s,x)=>s+(x.t=='income'?x.a:-x.a),0):0;
const sum=a=>a.reduce((s,x)=>s+x.a,0),cm=mk(ld());
function months(n){const o=[],now=new Date();for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);o.push({k:mk(iso(new Date(d.getTime()-d.getTimezoneOffset()*6e4))),l:d.toLocaleString('en',{month:'short'})})}return o}
function M(k){const t=(S?S.tx:[]).filter(x=>mk(x.d)==k);return{inc:sum(t.filter(x=>x.t=='income')),exp:sum(t.filter(x=>x.t=='expense')),inv:sum(t.filter(x=>x.t=='invest')),t}}
function nextDue(b){const n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),b.day||5);if(d<new Date(n.getFullYear(),n.getMonth(),n.getDate()))d.setMonth(d.getMonth()+1);return d}
const days=d=>Math.round((d-new Date(new Date().setHours(0,0,0,0)))/864e5);
const allBills=()=>(S?S.bills:[]).concat((S?S.loans:[]).filter(l=>l.out>0).map(l=>({n:l.n+' EMI',a:l.emi,day:l.day,b:l.b,loan:1})));

function calc(){
  const cur=M(cm),ms=months(4).slice(0,3).map(m=>M(m.k).exp).filter(x=>x>0),avg=ms.length?ms.reduce((a,b)=>a+b)/ms.length:cur.exp,
  liquid=(S?S.banks:[]).reduce((s,_,i)=>s+bal(i),0),
  investedVal=(S?S.investments:[]).reduce((s,inv)=>s+(inv.val||0),0) + sum((S?S.tx:[]).filter(x=>x.t=='invest')),
  monthlyInvestCommitment=(S?S.investments:[]).filter(inv=>inv.type!=='Insurance').reduce((s,inv)=>s+(inv.a||0),0),
  bills=allBills().filter(b=>days(nextDue(b))<=30).reduce((s,b)=>s+b.a,0),buffer=avg*3;
  
  return{
    cur,avg,liquid,invested:investedVal,monthlyInvestCommitment,bills,buffer,
    deploy:liquid-buffer-bills,
    debt:(S?S.loans:[]).reduce((s,l)=>s+l.out,0),
    emi:(S?S.loans:[]).filter(l=>l.out>0).reduce((s,l)=>s+l.emi,0),
    nw:liquid+investedVal-(S?S.loans:[]).reduce((s,l)=>s+l.out,0),
    rate:cur.inc?Math.max(0,(cur.inc-cur.exp)/cur.inc*100):0
  }
}

// Calendar-filtered Aggregates for Weekly, Monthly, Yearly based on summaryFilterDate
function getAggregates(){
  const filterDate = new Date(summaryFilterDate || ld());
  const filterIso = summaryFilterDate || ld();
  const filterYear = filterIso.slice(0,4);
  const filterMonth = mk(filterIso);
  const txs = S ? S.tx : [];
  
  // Weekly (7-day window ending on filterDate)
  const weekStart = new Date(filterDate.getTime() - 6*864e5);
  const weekTxs = txs.filter(x => { const d = new Date(x.d); return d >= weekStart && d <= filterDate; });
  const wInc = sum(weekTxs.filter(x=>x.t=='income')), wExp = sum(weekTxs.filter(x=>x.t=='expense'));

  // Monthly (matching month of filterDate)
  const mInc = sum(txs.filter(x=>mk(x.d)==filterMonth && x.t=='income'));
  const mExp = sum(txs.filter(x=>mk(x.d)==filterMonth && x.t=='expense'));

  // Yearly (matching year of filterDate)
  const yInc = sum(txs.filter(x=>x.d.startsWith(filterYear) && x.t=='income'));
  const yExp = sum(txs.filter(x=>x.d.startsWith(filterYear) && x.t=='expense'));

  return {
    weekly: { inc: wInc, exp: wExp, sav: wInc - wExp },
    monthly: { inc: mInc, exp: mExp, sav: mInc - mExp },
    yearly: { inc: yInc, exp: yExp, sav: yInc - yExp }
  };
}

  const c=calc().cur, spent={Food:0, Petrol:0, Fun:0};
  c.t.filter(x=>x.t=='expense').forEach(x=>{ if(spent[x.c]!==undefined) spent[x.c]+=x.a; });
  const foodB=S.budgets.Food||10000, petrolB=S.budgets.Petrol||4000, funB=S.budgets.Fun||4000;

    <div class="row"><h2>⛽ Monthly Expense Allowances</h2><button class="btn s sm" onclick="A.setBudgets()">⚙️ Edit Budgets</button></div>

}

function aggregatedSummaryWidget(){
  const ag = getAggregates();
  return `<div class="card">
    <div class="row"><h2>📊 Income, Expenses & Savings Summary</h2>
    <div style="width:160px"><label style="margin:0;font-size:10px">Calendar Filter Date</label><input type="date" id="summaryDate" value="${summaryFilterDate}" onchange="A.setSummaryDate(this.value)" style="padding:4px;font-size:12px"></div></div>
    <div class="grid3" style="text-align:center;margin-top:10px">
      <div class="stat"><small><b>Weekly</b></small><br><small class="pos">Inc: ${fmt(ag.weekly.inc)}</small><br><small class="neg">Exp: ${fmt(ag.weekly.exp)}</small><br><b>Sav: ${fmt(ag.weekly.sav)}</b></div>
      <div class="stat"><small><b>Monthly</b></small><br><small class="pos">Inc: ${fmt(ag.monthly.inc)}</small><br><small class="neg">Exp: ${fmt(ag.monthly.exp)}</small><br><b>Sav: ${fmt(ag.monthly.sav)}</b></div>
      <div class="stat"><small><b>Yearly</b></small><br><small class="pos">Inc: ${fmt(ag.yearly.inc)}</small><br><small class="neg">Exp: ${fmt(ag.yearly.exp)}</small><br><b>Sav: ${fmt(ag.yearly.sav)}</b></div>
    </div>
  </div>`;
}

function daily(){
  const t=ld(),tot=dayTotal(t),lim=S.dl,p=Math.min(100,tot/lim*100),td=S.tx.filter(x=>x.d==t&&x.t=='expense');
  return `<div class="card hero"><div class="row"><small>Today's spending</small><button class="btn sm" style="background:rgba(255,255,255,.22)" onclick="A.limit()">Budget ${fmt(lim)}</button></div><div class="big">${fmt(tot)}</div><div class="bar" style="background:rgba(255,255,255,.25);margin:8px 0"><i style="width:${p}%;background:${tot>lim?'#ffd1dc':'#fff'}"></i></div><small>${tot>lim?'Over budget by '+fmt(tot-lim):fmt(lim-tot)+' left today'}</small></div>
  <div class="card"><h2>⚡ Quick Add Spend</h2><input id="qa" type="number" inputmode="decimal" placeholder="Amount ₹"><input id="qn" placeholder="Note (optional)" style="margin-top:8px"><div class="chips">${Object.keys(EM).map(c=>`<button data-c="${c}" onclick="A.quick(this.dataset.c)">${EM[c]} ${c}</button>`).join('')}</div></div>

function txs(){
  const l=[...S.tx].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,60);
  return`<div class="card"><h2>Transaction History</h2>${l.length?l.map(x=>`<div class="item"><div><b>${esc(x.n||x.c)}</b><br><small>${x.d} · ${esc(x.c)}</small></div><div class="row"><b class="${x.t=='income'?'pos':x.t=='expense'?'neg':''}">${x.t=='income'?'+':'-'}${fmt(x.a)}</b><button class="ic" onclick="A.delTx('${x.id}')">✕</button></div></div>`).join(''):'<p class="mu">No transactions.</p>'}</div>`;

function loans(){
  const c=calc(),L=S.loans,ns=L.map(nper);
  return `<div class="card hero"><small>Total loans outstanding</small><div class="big">${fmt(c.debt)}</div><small>Monthly EMI ${fmt(c.emi)}</small></div>
  <div class="row" style="margin-bottom:10px"><h2 style="margin:0">Existing & Paid Loans</h2><button class="btn sm" onclick="A.addLoan()">+ Loan</button></div>
  ${L.map((l,i)=>{const n=ns[i],p=l.out===0?100:Math.min(100,Math.max(0,(1-l.out/(l.orig||l.out))*100));return`<div class="card"><div class="row"><div><b>${esc(l.n)}</b> ${l.out===0?'<span class="chip g">Paid Off</span>':''}</div><div style="text-align:right"><div style="font-size:20px;font-weight:700">${fmt(l.out)}</div><small>outstanding</small></div></div><div class="bar" style="margin:10px 0 6px"><i style="width:${p}%;background:var(--ac2)"></i></div><div class="row"><small>${l.rate}% · EMI ${fmt(l.emi)} · ${l.out===0?'Fully Paid':p.toFixed(0)+'% repaid'}</small></div><div class="row" style="margin-top:10px">${l.out>0?`<button class="btn s sm" onclick="A.pay(${i})">Mark EMI paid</button>`:''}<button class="btn s sm" onclick="A.updateLoan(${i})">✏️ Edit Outstanding</button><button class="ic" onclick="A.delL(${i})">Remove</button></div></div>`}).join('')||'<p class="mu">No loans added.</p>'}`;
}

function banks(){
  return `<div class="row" style="margin-bottom:10px"><h2 style="margin:0">Bank Accounts</h2><div class="row"><button class="btn s sm" onclick="A.addBank()">+ Bank</button><button class="btn sm" onclick="A.creditMoney()">+ Credit Money</button><button class="btn sm" onclick="autoAssign()">✨ Auto-assign</button></div></div>
  ${S.banks.map((b,i)=>`<div class="card"><div class="row"><div><b>${esc(b.n)}</b><br><small>${b.rate}% interest · ${b.cash}% cashback</small></div><div style="text-align:right"><div style="font-size:20px;font-weight:700">${fmt(bal(i))}</div><button class="ic" onclick="A.del('banks',${i})">Remove</button></div></div><div class="row" style="margin-top:8px"><select onchange="A.role(${i},this.value);render()" style="width:auto">${ROLES.map(r=>`<option ${r==b.role?'selected':''}>${r}</option>`).join('')}</select></div></div>`).join('')||'<p class="mu">No bank accounts.</p>'}`;
}

function invest(){
  const c=calc(), invs=S.investments||[];
  const currentYear = new Date().getFullYear();
  const yearsDiff = Math.max(1, projYear - currentYear);
  
  // Exclude insurance from investment corpus and monthly commitment projections
  const pureInvestments = invs.filter(inv => inv.type !== 'Insurance');
  const monthlyTot = pureInvestments.reduce((sum, inv) => sum + (inv.a || 0), 0);
  const pv = pureInvestments.reduce((sum, inv) => sum + (inv.val || 0), 0);

  const r = (projCagr / 100) / 12;
  const n = yearsDiff * 12;
  let futureVal = pv * Math.pow(1 + r, n);
  if(r > 0) futureVal += monthlyTot * ((Math.pow(1 + r, n) - 1) / r);
  else futureVal += pv + monthlyTot * n;

  return `<div class="card hero"><small>Current Total Net Worth</small><div class="big">${fmt(c.nw)}</div><small>Total Investment Value: ${fmt(c.invested)} · Monthly Commitment: ${fmt(c.monthlyInvestCommitment)}</small></div>
  
  <div class="card">
    <div class="row"><h2>📈 Portfolio Projection (Excl. Insurance, Year ${projYear})</h2><button class="btn s sm" onclick="A.setProjection()">⚙️ Configure</button></div>
    <div class="row" style="margin:10px 0"><div><small>Target Year</small><br><b>${projYear} (${yearsDiff} yrs)</b></div><div><small>Assumed CAGR</small><br><b>${projCagr}% p.a.</b></div><div><small>Projected Corpus</small><br><b class="pos" style="font-size:18px">${fmt(futureVal)}</b></div></div>
    <div class="bar"><i style="width:100%;background:linear-gradient(90deg,#6c5ce7,#00b8a0)"></i></div>
    <small class="mu" style="margin-top:6px;display:block">Based on investment corpus (${fmt(pv)}) and pure wealth SIP commitments (${fmt(monthlyTot)}).</small>
  </div>

  <div class="row" style="margin-bottom:10px"><h2 style="margin:0">🛡️ SIPs & Insurance Premiums</h2><button class="btn sm" onclick="A.addInvestment()">+ Investment / Insurance</button></div>
  ${invs.map((inv, i)=>`<div class="card"><div class="row"><div><b>${esc(inv.n)}</b> <span class="chip g">${esc(inv.type||'Investment')}</span><br><small>Monthly Outflow: <b>${fmt(inv.a)}</b> · Expected Rate: ${inv.rate||0}%</small></div><div style="text-align:right"><div style="font-size:18px;font-weight:700">${fmt(inv.val||0)}</div><small>Accumulated Value</small></div></div><div class="row" style="margin-top:10px"><button class="btn s sm" onclick="A.payInvestment(${i})">Mark Paid This Month</button><button class="btn s sm" onclick="A.editInvestment(${i})">✏️ Edit</button><button class="ic" onclick="A.delInvestment(${i})">Remove</button></div></div>`).join('')||'<p class="mu">No investments or premiums added yet.</p>'}
  
  <div class="card"><div class="row"><h2>🎯 Future Goals</h2><button class="btn s sm" onclick="A.addGoal()">+ Add Goal</button></div>${S.goals.map((g,i)=>{const p=Math.min(100,g.s/g.t*100);return`<div style="margin:12px 0"><div class="row"><b>${esc(g.n)}</b><div><small>${fmt(g.s)} / ${fmt(g.t)}</small> <button class="ic" onclick="A.fund(${i})">＋</button><button class="ic" onclick="A.del('goals',${i})">✕</button></div></div><div class="bar"><i style="width:${p}%;background:var(--ac2)"></i></div></div>`}).join('')||'<p class="mu">Set a goal.</p>'}</div>`;
}

function aiv(){ return `<div class="card"><h2>✨ AI Advisor</h2><p class="mu">Ask questions about allocations, loan prepayments, or budgets.</p></div>`; }

const FIX=['Rent','Bills','EMI'],EM={Food:'🍔',Petrol:'⛽',Transport:'🚌',Shopping:'🛍️',Health:'💊',Fun:'🎬',Other:'🧩'};
const dayTotal=d=>sum(S.tx.filter(x=>x.d==d&&x.t=='expense'&&!FIX.includes(x.c)));
const nper=l=>{const r=l.rate/1200;if(l.emi<=0||l.out<=0)return 0;if(!r)return l.out/l.emi;const x=1-r*l.out/l.emi;return x<=0?Infinity:-Math.log(x)/Math.log(1+r)};

function form(title,fields,fn){
  const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div><h2>${title}</h2>${fields.map(f=>`<label>${f.l}</label>${f.o?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${o[0]??o}">${o[1]??o}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${f.v??''}" ${f.t=='number'?'inputmode="decimal"':''}>`}`).join('')}<div class="row" style="margin-top:16px"><button class="btn s" id="x">Cancel</button><button class="btn" id="ok">Save</button></div></div>`;
  document.body.appendChild(d);d.onclick=e=>{if(e.target==d)d.remove()};d.querySelector('#x').onclick=()=>d.remove();
  d.querySelector('#ok').onclick=()=>{const v={};fields.forEach(f=>{const e=d.querySelector('#f_'+f.k);v[f.k]=f.t=='number'?parseFloat(e.value)||0:e.value});fn(v);save();d.remove();render()}
}
const bankOpts=()=>S.banks.map((b,i)=>[i,b.n]);

const A = {
  logout(){
    currentUser = null; currentAccId = ''; S = null; authStep = 'login';
    localStorage.removeItem('fm_current_user'); localStorage.removeItem('fm_current_acc');
    render();
  },
  go(v){ view = v; render(); },
  theme(){
    const r=document.documentElement, d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;
    r.dataset.theme=d?'light':'dark';
  },
  setSummaryDate(val){
    if(val){ summaryFilterDate = val; render(); }
  },
  setBudgets(){
    const cats = Object.keys(CATS);
    const fields = cats.map(c=>({k:c, l:`${c} Monthly Budget (₹)`, t:'number', v:S.budgets[c]||0}));
    form('Edit Monthly Category Budgets', fields, v=>{ S.budgets = v; save(); render(); });
  },
  setProjection(){
    form('Configure Portfolio Projection', [
      {k:'year', l:'Target Future Year (e.g. 2050)', t:'number', v:projYear},
      {k:'cagr', l:'Assumed Annual Return CAGR %', t:'number', v:projCagr}
    ], v=>{
      if(v.year > 2020) projYear = v.year;
      if(v.cagr >= 0) projCagr = v.cagr;
      render();
    });
  },
  creditMoney(){
    if(!S.banks.length)return A.addBank();
    form('Credit Money to Account', [
      {k:'a', l:'Credited Amount (₹)', t:'number'},
      {k:'n', l:'Source / Note (e.g. Refund, Freelance, Gift)', v:'Credit'},
      {k:'b', l:'Deposit to Bank', o:bankOpts()},
      {k:'d', l:'Date', t:'date', v:ld()}
    ], v=>{
      if(v.a > 0){
        S.tx.push({id:'t'+Date.now(), t:'income', a:v.a, c:'Other income', b:+v.b, d:v.d, n:v.n});
        save(); render();
      }
    });
  },
  addTx(){
    if(!S.banks.length)return A.addBank();
    form('Add transaction',[{k:'t',l:'Type',o:[['expense','Expense'],['income','Income'],['invest','Investment']]},{k:'a',l:'Amount (₹)',t:'number'},{k:'c',l:'Category',o:Object.keys(CATS).concat(['Salary','Index Fund SIP','Gold','Other income'])},{k:'b',l:'Bank',o:bankOpts()},{k:'d',l:'Date',t:'date',v:ld()},{k:'n',l:'Note'}],v=>{if(v.a>0)S.tx.push({...v,b:+v.b,id:'t'+Date.now()})});
  },
  delTx(id){ S.tx=S.tx.filter(x=>x.id!=id); save(); render(); },
  quick(c){
    const a=parseFloat($('#qa').value); if(!S.banks.length){A.addBank();return} if(!(a>0))return;
    const b=Math.max(0,S.banks.findIndex(x=>x.role=='Expense'));
    S.tx.push({id:'t'+Date.now(),t:'expense',a,c,b,d:ld(),n:$('#qn').value||c}); save(); render();
  },
  limit(){ form('Daily budget',[{k:'a',l:'Daily limit (₹)',t:'number',v:S.dl}],v=>{if(v.a>0)S.dl=v.a}); },
  addInvestment(){
    if(!S.banks.length)return A.addBank();
    form('Add SIP / Insurance / Investment', [
      {k:'n', l:'Name (e.g. Health Insurance, Term Policy, SIP)'},
      {k:'a', l:'Monthly Outflow / Premium (₹)', t:'number'},
      {k:'type', l:'Category Type', o:[['Insurance','Insurance'],['SIP / Equity','SIP / Equity'],['PPF / Debt','PPF / Debt'],['FD / RD','FD / RD']]},
      {k:'rate', l:'Expected Returns % p.a.', t:'number', v:8},
      {k:'val', l:'Current Total Accumulated Value (₹)', t:'number', v:0},
      {k:'b', l:'Debited Bank', o:bankOpts()}
    ], v=>{
      if(v.n && v.a>0){
        S.investments.push({id:'inv'+Date.now(), ...v, b:+v.b});
        save(); render();
      }
    });
  },
  editInvestment(i){
    const inv = S.investments[i];
    form('Edit '+esc(inv.n), [
      {k:'n', l:'Name', v:inv.n},
      {k:'a', l:'Monthly Outflow (₹)', t:'number', v:inv.a},
      {k:'val', l:'Accumulated Corpus Value (₹)', t:'number', v:inv.val||0},
      {k:'rate', l:'Expected Return % p.a.', t:'number', v:inv.rate||0}
    ], v=>{
      S.investments[i].n = v.n; S.investments[i].a = v.a; S.investments[i].val = v.val; S.investments[i].rate = v.rate;
      save(); render();
    });
  },
  payInvestment(i){
    const inv = S.investments[i];
    inv.val = (inv.val || 0) + inv.a;
    S.tx.push({id:'t'+Date.now(), t:'invest', a:inv.a, c:'Investments', b:inv.b, d:ld(), n:inv.n+' Premium/SIP'});
    save(); render();
  },
  delInvestment(i){ S.investments.splice(i,1); save(); render(); },
  addLoan(){
    if(!S.banks.length)return A.addBank();
    form('Add Loan',[{k:'n',l:'Loan name'},{k:'orig',l:'Original loan (₹)',t:'number'},{k:'out',l:'Outstanding now (₹)',t:'number'},{k:'rate',l:'Interest % p.a.',t:'number'},{k:'emi',l:'Monthly EMI (₹)',t:'number'},{k:'day',l:'EMI date (1-28)',t:'number',v:5},{k:'b',l:'Debited from',o:bankOpts()}],v=>{if(v.n&&v.emi>0)S.loans.push({...v,b:+v.b,day:Math.min(28,Math.max(1,v.day||1)),orig:v.orig||v.out})});
  },
  updateLoan(i){
    const l = S.loans[i];
    form('Update Loan: '+esc(l.n), [{k:'out', l:'Remaining Outstanding (₹)', t:'number', v:l.out},{k:'orig', l:'Original Loan Total (₹)', t:'number', v:l.orig||l.out},{k:'emi', l:'Monthly EMI (₹)', t:'number', v:l.emi},{k:'rate', l:'Interest Rate % p.a.', t:'number', v:l.rate}], v=>{
      S.loans[i].out = Math.max(0, v.out); S.loans[i].orig = v.orig; S.loans[i].emi = v.emi; S.loans[i].rate = v.rate; save(); render();
    });
  },
  pay(i){
    const l=S.loans[i],pi=l.out*l.rate/1200,pp=Math.min(l.out,Math.max(0,l.emi-pi));
    l.out=Math.max(0,l.out-pp); S.tx.push({id:'t'+Date.now(),t:'expense',a:l.emi,c:'EMI',b:l.b,d:ld(),n:l.n+' EMI'}); save(); render();
  },
  delL(i){ S.loans.splice(i,1); save(); render(); },
  addBank(){ form('Add bank account',[{k:'n',l:'Bank name'},{k:'open',l:'Current balance (₹)',t:'number'},{k:'rate',l:'Interest % p.a.',t:'number'},{k:'cash',l:'Cashback %',t:'number'},{k:'min',l:'Minimum balance (₹)',t:'number'}],v=>{if(v.n)S.banks.push({...v,role:'Backup'})}); },
  del(k,i){ S[k].splice(i,1); save(); render(); },
  role(i,v){ S.banks[i].role=v; save(); },
  risk(r){ S.risk=r; save(); render(); },
  addGoal(){ form('Add goal',[{k:'n',l:'Goal'},{k:'t',l:'Target (₹)',t:'number'},{k:'s',l:'Saved so far (₹)',t:'number'}],v=>{if(v.n&&v.t>0)S.goals.push(v)}); },
  fund(i){ form('Add to '+esc(S.goals[i].n),[{k:'a',l:'Amount (₹)',t:'number'}],v=>{S.goals[i].s+=v.a}); }
};

function autoAssign(){
  const b=S.banks; if(!b.length)return; b.forEach(x=>x.role='Backup');
  const ex=b.reduce((m,x)=>x.cash>m.cash?x:m,b[0]); ex.role='Expense'; save(); render();
}

function renderAuth(){
  const app = $('#app');
  if (authStep === 'login') {
    app.innerHTML = `<div class="card auth-container">
      <h2>🔐 Unlock Finance Manager</h2>
      <label>Email Address</label>
      <input id="l_email" type="email" placeholder="you@example.com" value="${esc(tempEmail)}">
      <label>Passcode</label>
      <input id="l_pass" type="password" placeholder="Passcode" value="${esc(tempPass)}">
      <button class="btn" style="width:100%;margin-top:16px" onclick="handleAuthSubmit()">Next (Authenticator Setup)</button>
    </div>`;
  } else if (authStep === 'totp_setup') {
    const otpauth = `otpauth://totp/FinanceManager:${encodeURIComponent(tempEmail)}?secret=${tempSecret}&issuer=FinanceManager`;
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(otpauth)}`;
    app.innerHTML = `<div class="card auth-container">
      <h2>🔑 Setup Authenticator App</h2>
      <p class="mu">Scan QR code in Google Authenticator or Microsoft Authenticator:</p>
      <div style="text-align:center;margin:12px 0"><img src="${qrUrl}" alt="Authenticator QR Code" style="border-radius:12px;border:1px solid var(--bd)"></div>
      <small>Or manually enter secret key:</small>
      <div class="secret-box">${tempSecret}</div>
      <label>Enter 6-Digit Authenticator Code</label>
      <input id="l_totp" type="text" placeholder="123456" maxlength="6">
      <button class="btn" style="width:100%;margin-top:14px" onclick="handleTotpVerify()">Verify & Unlock</button>
      <button class="btn s" style="width:100%;margin-top:8px" onclick="authStep='login';renderAuth();">Back</button>
    </div>`;
  } else if (authStep === 'totp_verify') {
    app.innerHTML = `<div class="card auth-container">
      <h2>🔑 Authenticator Verification</h2>
      <p class="mu">Enter 6-digit code from Google or Microsoft Authenticator for <b>${esc(tempEmail)}</b>:</p>
      <label>6-Digit Authenticator Code</label>
      <input id="l_totp" type="text" placeholder="123456" maxlength="6">
      <button class="btn" style="width:100%;margin-top:14px" onclick="handleTotpVerify()">Verify & Unlock</button>
      <button class="btn s" style="width:100%;margin-top:8px" onclick="authStep='login';renderAuth();">Back</button>
    </div>`;
  }
}

window.handleAuthSubmit = function(){
  const email = $('#l_email')?.value.trim();
  const pass = $('#l_pass')?.value.trim();
  if(!email || !pass){ alert('Please enter email and passcode'); return; }
  tempEmail = email; tempPass = pass;
  let savedUser = null;
  try{ savedUser = JSON.parse(localStorage.getItem('user_sec_' + tempEmail)); }catch(e){}
  if(savedUser && savedUser.totpSecret){
    tempSecret = savedUser.totpSecret;
    authStep = 'totp_verify';
  } else {
    tempSecret = generateBase32Secret(16);
    authStep = 'totp_setup';
  }
  renderAuth();
};

window.handleTotpVerify = async function(){
  const code = $('#l_totp')?.value.trim();
  if(!code || code.length !== 6){ alert('Please enter valid 6-digit code'); return; }
  const valid = await verifyTotpToken(tempSecret, code);
  if(!valid){ alert('Invalid Authenticator code. Check app time sync.'); return; }
  localStorage.setItem('user_sec_' + tempEmail, JSON.stringify({ email: tempEmail, totpSecret: tempSecret }));
  currentUser = { email: tempEmail };
  accounts = [{id:'default', name:'Personal'}];
  currentAccId = accounts[0].id;
  loadState();
  save();
  render();
};

function render(){
  initAccounts();
  if(!currentUser){ renderAuth(); return; }
  const t=[['home','🏠','Home'],['tx','📅','Daily'],['banks','🏦','Banks'],['loans','💳','Loans'],['inv','📈','Invest'],['ai','✨','AI']];
  $('#app').innerHTML=`<header><div><h1>💸 Finance Manager</h1><small>User: <b>${esc(currentUser.email)}</b></small></div><div class="row"><button class="btn s sm" onclick="A.logout()">Logout</button><button class="ic" onclick="A.theme()" style="margin-left:4px">🌓</button></div></header>` +
  {home,tx:daily,banks,loans,inv:invest,ai:aiv}[view]() +
  `<nav>${t.map(x=>`<button class="${view==x[0]?'on':''}" onclick="A.go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>` +
  (view=='home'||view=='tx'?'<button class="fab" onclick="A.addTx()">+</button>':'');
}

document.addEventListener('DOMContentLoaded', render);
render();
</script>
