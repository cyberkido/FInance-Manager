<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Finance Manager</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#141a2e;--mu:#6b7490;--bd:#e3e7f1;--ac:#6c5ce7;--ac2:#00b8a0;--rd:#ef476f;--am:#f2a31b;--sh:0 6px 24px rgba(40,50,110,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0f1d;--card:#171b2f;--tx:#eef0fa;--mu:#9099b8;--bd:#272c47;--sh:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0c0f1d;--card:#171b2f;--tx:#eef0fa;--mu:#9099b8;--bd:#272c47;--sh:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
#app{max-width:720px;margin:0 auto;padding:14px 14px 110px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px}small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,#6c5ce7,#00b8a0);color:#fff;border:0}
.hero small{color:rgba(255,255,255,.8)}.big{font-size:32px;font-weight:700;letter-spacing:-.5px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px}.stat b{display:block;font-size:15px}
.bar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;transition:width .8s}
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);gap:8px}.item:last-child{border:0}
.pos{color:var(--ac2)}.neg{color:var(--rd)}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac);font-weight:600}
.chip.g{background:color-mix(in srgb,var(--ac2) 18%,transparent);color:var(--ac2)}.chip.w{background:color-mix(in srgb,var(--am) 20%,transparent);color:var(--am)}
button,select,input{font:inherit;color:var(--tx)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer}.btn.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}.btn.sm{padding:6px 10px;font-size:13px}
.ic{background:none;border:0;cursor:pointer;color:var(--mu);font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:2px 8px;border-radius:10px}nav button span{font-size:20px}nav button.on{color:var(--ac);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;border:0;background:var(--ac);color:#fff;box-shadow:0 8px 20px rgba(108,92,231,.5);cursor:pointer;z-index:6}
.sheet{position:fixed;inset:0;background:rgba(5,8,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--card);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .25s}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.ai{white-space:normal;line-height:1.55}.msg{padding:10px 12px;border-radius:14px;margin:8px 0;max-width:92%}.msg.u{background:var(--ac);color:#fff;margin-left:auto}.msg.a{background:var(--bg);border:1px solid var(--bd)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer}
.scroll{overflow-x:auto}.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer}.seg .on{background:var(--ac);color:#fff}
.note{font-size:12px;color:var(--mu);margin-top:8px}
.auth-container{max-width:400px;margin:60px auto;padding:20px}
</style></head><body><div id="app">
